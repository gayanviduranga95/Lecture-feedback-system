name: Member 3 - Automated Testing

on:
  push:
    branches:
      - test/member3-unit-bdd-automation
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  member3-tests:
    name: Unit, BDD and Browser Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: lfps
          POSTGRES_PASSWORD: dev_only_password
          POSTGRES_DB: lecture_feedback_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lfps"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://lfps:dev_only_password@127.0.0.1:5432/lecture_feedback_e2e?schema=public
      TEST_DATABASE_URL: postgresql://lfps:dev_only_password@127.0.0.1:5432/lecture_feedback_test?schema=public
      SESSION_SECRET: ci-test-session-secret-0123456789-abcdef
      JOIN_CODE_KEY: ci-test-join-code-key-0123456789-abcdef
      FRONTEND_ORIGIN: http://localhost:5173
      NODE_ENV: development
      LOG_LEVEL: silent
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Create browser testing database
        run: |
          PGPASSWORD=dev_only_password psql \
            -h 127.0.0.1 -U lfps \
            -d lecture_feedback_test \
            -c "CREATE DATABASE lecture_feedback_e2e OWNER lfps;"

      - name: Apply backend test database migrations
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: npm run db:migrate

      - name: Apply browser test database migrations
        working-directory: backend
        run: npm run db:migrate

      - name: Run backend Vitest tests
        working-directory: backend
        run: npm test

      - name: Run Cucumber BDD scenarios
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          NODE_ENV: test
          NODE_OPTIONS: --import=tsx
        run: >
          npx cucumber-js
          --import "features/step_definitions/*.ts"
          features/student-login.feature

      - name: Seed browser testing database
        working-directory: backend
        run: npm run db:seed

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Member 3 Playwright tests
        working-directory: frontend
        run: >
          npx playwright test
          e2e/member3-auth.spec.ts
          --project=desktop

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: member3-playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: member3-playwright-failures
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
